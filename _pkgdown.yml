url: https://ruralinnovation.github.io

destination: "./docs"

template:
  bootstrap: 5

navbar:
  title: "CORI DB"
  left:
    - icon: fa-home fa-lg
      href: index.html
    - text: "Functions"
      href: reference/index.html
  right:
    - icon: fab fa-github
      href: https://github.com/ruralinnovation/cori_db


reference:
  - title: "Setup and Access"
    desc: >
      Functions for setting up a database connection
    contents:
      - set_db_credentials
      - connect_to_db
  - title: "Explore"
    desc: >
      Functions to search and compare tables on the database
    contents:
      - search_db_tables
      - get_db_column_names
      - schema_size_db
      - compare_dimensions
      - get_dims
  - title: "Read and Write Data"
    desc: >
      Functions for reading and writing data
    contents:
      - read_db
      - read_acs
      - read_sql
      - write_db
      - simple_write_to_db
      - safely_write_to_db
      - prepare_to_write_table
      - copy_table_across_databases
      - copy_table_across_schemas
  - title: "Metadata"
    desc: >
      Functions for creating, storing, and loading metadata
    contents:
      - create_metadata_tables
      - update_metadata
      - load_session_metadata
      - write_session_codebook
  - title: "SQL Helpers"
    desc: >
      Helper functions for running SQL code from an R session
    contents:
      - execute_on_postgres
      - make_aliased_query
      - update_join
      - get_sql

